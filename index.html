<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEPLA TV - Télévision Missionnaire en Continu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: linear-gradient(135deg, #fef08a 0%, #fde047 50%, #facc15 100%); 
            color: #111827; 
            width: 100%;
            max-width: 1050px; 
            margin: 0 auto; 
            padding: 15px; 
            min-height: 100vh;
        }

        /* En-tête de Luxe */
        header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border: 2px solid #eab308; 
            padding: 12px 20px; 
            margin-bottom: 22px; 
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(161, 98, 7, 0.2), 0 4px 12px rgba(0, 0, 0, 0.05);
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            cursor: pointer; 
            user-select: none; 
            text-decoration: none;
        }

        /* Logo fixe et propre (sans effet caché) */
        .brand-logo-container {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            padding: 3px;
            background: #1e3a8a;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
            flex-shrink: 0;
        }

        .brand-logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
        }

        .title-box h1 { 
            font-size: 24px; 
            font-weight: 900;
            color: #1e3a8a; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .title-box p { 
            font-size: 11px; 
            color: #d97706; 
            font-weight: 700;
        }

        /* Zone Boutons Compte / Auth en haut à droite */
        .user-nav {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: #1e3a8a;
            color: #ffffff;
            border: none;
            padding: 9px 15px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
        }

        .nav-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .nav-btn-secondary {
            background: #dc2626;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
        }

        .nav-btn-secondary:hover {
            background: #b91c1c;
        }

        .nav-btn-success {
            background: #16a34a;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
        }

        .nav-btn-success:hover {
            background: #15803d;
        }

        /* Barre de recherche */
        .search-container { 
            margin-bottom: 22px; 
            display: flex;
            justify-content: flex-end;
        }

        .search-container input { 
            width: 100%; 
            max-width: 360px; 
            padding: 11px 18px; 
            background: #ffffff; 
            border: 2px solid #eab308; 
            color: #111827; 
            border-radius: 25px; 
            font-size: 13px; 
            font-weight: 600;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.25);
        }

        /* Lecteur TV Haut de Gamme */
        .tv-section { 
            background: #000000; 
            border-radius: 16px; 
            overflow: hidden; 
            border: 3px solid #1e3a8a; 
            margin-bottom: 28px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .live-tag-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .live-tag { 
            background: linear-gradient(90deg, #dc2626, #b91c1c); 
            color: white; 
            padding: 5px 12px; 
            font-size: 11px; 
            font-weight: 800; 
            border-radius: 20px; 
            letter-spacing: 0.8px;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.8);
            animation: pulse-red 2s infinite;
        }

        .current-playing-title {
            font-size: 13px;
            color: #fde047;
            font-weight: 700;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        video, iframe { 
            width: 100%; 
            height: auto; 
            aspect-ratio: 16/9; 
            background: #000000; 
            display: block; 
            border: none;
        }

        /* Section des Profils TV */
        .profiles-section h2 { 
            font-size: 19px; 
            margin-bottom: 18px; 
            color: #1e3a8a; 
            border-left: 5px solid #2563eb; 
            padding-left: 10px; 
            font-weight: 800;
        }

        .grid-tv { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); 
            gap: 15px; 
        }

        .tv-card { 
            background: #ffffff; 
            border: 2px solid #fef08a; 
            border-radius: 14px; 
            padding: 15px 10px; 
            text-align: center; 
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            position: relative;
        }

        .tv-card:hover {
            transform: translateY(-5px);
            border-color: #2563eb;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
        }

        .channel-number {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #1e3a8a;
            color: #fde047;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .tv-card img { 
            width: 65px; 
            height: 65px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 8px; 
            margin-top: 5px;
            border: 3px solid #2563eb; 
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
        }

        .tv-card h3 { 
            font-size: 14px; 
            font-weight: 800;
            margin-bottom: 4px; 
            color: #1e3a8a; 
            word-break: break-word; 
        }

        .tv-card p { 
            font-size: 11px; 
            color: #4b5563; 
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .status-badge { 
            display: inline-block; 
            font-size: 10px; 
            font-weight: 800;
            padding: 3px 9px; 
            border-radius: 12px; 
            background: #16a34a; 
            color: #ffffff; 
        }

        @media (max-width: 600px) {
            header { flex-direction: column; gap: 12px; text-align: center; }
            .search-container input { max-width: 100%; }
            .user-nav { justify-content: center; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- EN-TÊTE ÉPURÉ SANS EFFET CACHÉ -->
    <header>
        <a href="index.html" class="brand" title="Accueil MEPLA TV">
            <div class="brand-logo-container">
                <img src="https://i.postimg.cc/Zqm3K70t/grok-1792570897280.jpg" alt="Logo MEPLA TV" class="brand-logo">
            </div>
            <div class="title-box">
                <h1>MEPLA TV</h1>
                <p>Diffusion 24h/24 & Réseau des Chaînes Missionnaires</p>
            </div>
        </a>
        
        <!-- ZONE COMPTE / AUTHENTIFICATION (Haut de page) -->
        <div class="user-nav" id="user-nav-box">
            <!-- Rempli dynamiquement en JS -->
        </div>
    </header>

    <!-- BARRE DE RECHERCHE DE CHAÎNE -->
    <div class="search-container">
        <input type="text" id="search-input" placeholder="🔍 Rechercher par nom ou numéro (ex: 01, 02)..." onkeyup="filterTV()">
    </div>

    <!-- LECTEUR DE LA CHAÎNE PRINCIPALE -->
    <div class="tv-section">
        <div class="live-tag-bar">
            <span class="live-tag">🔴 EN DIRECT CONTINU 24H/24</span>
            <span class="current-playing-title" id="current-tv-display">MEPLA TV Officiel - Chaîne Principale</span>
        </div>
        <div id="video-container">
            <video id="main-video-player" controls autoplay playsinline>
                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                Votre navigateur ne supporte pas la lecture vidéo.
            </video>
        </div>
    </div>

    <!-- SECTION DES PROFILS DE TÉLÉVISIONS DE FIREBASE -->
    <div class="profiles-section">
        <h2>Chaînes Missionnaires Disponibles</h2>
        <div class="grid-tv" id="firebase-tv-grid">
            <!-- Chargement automatique depuis Firebase -->
        </div>
    </div>

    <!-- SCRIPTS FIREBASE & GESTION DU COMPTE -->
    <script type="module">
        import { auth, database } from "./firebase.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const userNavBox = document.getElementById('user-nav-box');

        // GESTION DYNAMIQUE DES BOUTONS DE CONNEXION / PROFIL
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Utilisateur connecté
                userNavBox.innerHTML = `
                    <a href="profil-television.html" class="nav-btn nav-btn-success">📺 Mon Profil TV</a>
                    <button id="logoutBtn" class="nav-btn nav-btn-secondary">Déconnexion</button>
                `;

                document.getElementById('logoutBtn').addEventListener('click', async () => {
                    await signOut(auth);
                    localStorage.removeItem("active_tv_user");
                    localStorage.removeItem("active_tv_nom");
                    localStorage.removeItem("active_tv_key");
                    window.location.reload();
                });
            } else {
                // Utilisateur non connecté
                userNavBox.innerHTML = `
                    <a href="connexion.html" class="nav-btn">🔑 Connexion</a>
                    <a href="inscription.html" class="nav-btn nav-btn-success">✨ Créer un compte</a>
                `;
            }
        });

        // CHARGEMENT DES CHAÎNES DEPUIS FIREBASE
        async function loadTVProfiles() {
            const gridContainer = document.getElementById('firebase-tv-grid');
            try {
                const dbRef = ref(database, 'users');
                const snapshot = await get(dbRef);
                
                if (snapshot.exists()) {
                    gridContainer.innerHTML = ""; 
                    const data = snapshot.val();
                    let index = 1;
                    
                    Object.keys(data).forEach(key => {
                        const tv = data[key];
                        const channelName = tv.channelName || tv.nom || 'Chaîne Missionnaire';
                        const numFormatted = tv.channelNumber ? String(tv.channelNumber) : String(index).padStart(2, '0');

                        const card = document.createElement('div');
                        card.className = 'tv-card';
                        card.setAttribute('data-search', `${numFormatted} ${channelName.toLowerCase()}`);
                        card.innerHTML = `
                            <span class="channel-number">N°${numFormatted}</span>
                            <img src="${tv.photo || 'https://i.postimg.cc/Zqm3K70t/grok-1792570897280.jpg'}" alt="${channelName}">
                            <h3>${channelName}</h3>
                            <p>${tv.description || 'Chaîne Télévision Missionnaire'}</p>
                            <span class="status-badge">En Direct</span>
                        `;

                        card.addEventListener('click', () => {
                            document.getElementById('current-tv-display').innerText = `Diffusion en cours : ${channelName} (Canal N°${numFormatted})`;
                            alert(`Vous suivez à présent la chaîne : ${channelName} (Canal N°${numFormatted})`);
                        });

                        gridContainer.appendChild(card);
                        index++;
                    });
                } else {
                    gridContainer.innerHTML = "<p style='color: #1e3a8a; font-weight: bold;'>Aucune chaîne enregistrée pour le moment.</p>";
                }
            } catch (error) {
                console.error("Erreur de chargement des profils :", error);
            }
        }

        loadTVProfiles();
    </script>

    <!-- SCRIPT DE RECHERCHE DYNAMIQUE -->
    <script>
        function filterTV() {
            let input = document.getElementById('search-input').value.toLowerCase().trim();
            let cards = document.getElementsByClassName('tv-card');

            for (let i = 0; i < cards.length; i++) {
                let searchData = cards[i].getAttribute('data-search') || "";
                if (searchData.indexOf(input) > -1) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
