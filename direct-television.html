<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEPLA TV - Régie Direct Studio Pro HD</title>
  <!-- FontAwesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }
    body {
      background: #0b0b0f;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-y: auto;
    }

    /* Entête Studio TV */
    header {
      background-color: #1a1a24;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #383838;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }
    .brand i { color: #ff0000; font-size: 1.4rem; }
    
    .badge-live {
      background: #383838;
      color: #aaa;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .badge-live.active {
      background: #ff0000;
      color: #fff;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    /* Layout Principal Vertical et Large */
    .main-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    /* Moniteur Vidéo PRO & Canvas Studio derrière la personne */
    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border: 3px solid #333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #sourceVideo { display: none; }
    #outputCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Logo de la chaîne en filigrane */
    .tv-logo-watermark {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 0.85rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
      backdrop-filter: blur(4px);
    }
    .tv-logo-watermark span { color: #ff0000; }

    /* Grand Chronomètre d'Antenne */
    .timer-overlay {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #ff0000;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 1.1rem;
      color: #fff;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(4px);
    }
    .timer-overlay i { color: #ff0000; animation: blink 1s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

    /* Grille de sélection des fonds de studio lumineux */
    .studio-bg-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .bg-btn {
      background: #121212;
      border: 2px solid #383838;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }
    .bg-btn:hover { border-color: #3ea6ff; background: #222; }
    .bg-btn.active { border-color: #3ea6ff; background: rgba(62,166,255,0.3); }

    /* Barre de Contrôle Régie Pro */
    .controls-bar {
      background-color: #1a1a24;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid #383838;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background-color: #383838;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-size: 0.9rem;
      flex: 1;
      justify-content: center;
      min-width: 140px;
    }
    button:hover { background-color: #505050; }
    button.btn-danger { background-color: #cc0000; flex: 2; font-size: 1rem; }
    button.btn-danger:hover { background-color: #ff0000; }
    button.btn-success { background-color: #2e7d32; flex: 2; font-size: 1rem; }
    button.btn-download { background-color: #3ea6ff; color: #000; flex: 2; }
    button.active-state { background-color: #3ea6ff; color: #000; }

    /* Panneau Paramètres & Statistiques */
    .panel {
      background-color: #1a1a24;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid #383838;
    }
    .panel-title {
      font-size: 0.95rem;
      border-bottom: 1px solid #383838;
      padding-bottom: 8px;
      color: #3ea6ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; color: #aaa; }
    select { background-color: #121212; border: 1px solid #383838; color: white; padding: 10px; border-radius: 6px; outline: none; font-size: 0.9rem; }

    .audience-box {
      background: #121212;
      border-radius: 8px;
      border: 1px solid #383838;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .audience-number { font-size: 1.5rem; font-weight: 900; color: #3ea6ff; }
  </style>
</head>
<body>

  <!-- Entête Studio -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-satellite-dish"></i>
      <span id="headerChannelName">MEPLA TV - RÉGIE DIRECT</span>
    </div>
    <div id="liveBadge" class="badge-live">HORS LIGNE</div>
  </header>

  <div class="main-container">
    
    <!-- Moniteur Vidéo Grand Écran Central (Canvas Dynamique avec Éclairage Studio) -->
    <div class="video-wrapper">
      <div class="tv-logo-watermark" id="watermarkBrand">MEPLA<span>TV</span></div>
      
      <!-- Chronomètre du direct en grand -->
      <div class="timer-overlay" id="timerDisplay" style="display:none;">
        <i class="fa-solid fa-circle"></i> <span id="timeCounter">00:00</span>
      </div>

      <video id="sourceVideo" autoplay playsinline muted></video>
      <canvas id="outputCanvas"></canvas>
    </div>

    <!-- Sélecteur de Fonds Lumineux Studio -->
    <div class="panel">
      <h3 class="panel-title"><i class="fa-solid fa-palette"></i> Éclairage & Fonds Studio Lumineux</h3>
      <div class="studio-bg-grid">
        <button class="bg-btn active" onclick="setStudioBg(1)">Blanc Lumineux</button>
        <button class="bg-btn" onclick="setStudioBg(2)">Bleu Électrique</button>
        <button class="bg-btn" onclick="setStudioBg(3)">Jaune Studio</button>
        <button class="bg-btn" onclick="setStudioBg(4)">Cyber Néon</button>
      </div>
    </div>

    <!-- Barre de Contrôle Régie Pro -->
    <div class="controls-bar">
      <div class="btn-group">
        <button id="toggleCamBtn" onclick="toggleCamera()"><i class="fa-solid fa-video"></i> Caméra</button>
        <button id="switchCameraBtn" onclick="switchCamera()"><i class="fa-solid fa-camera-rotate"></i> Pivoter Caméra</button>
        <button id="toggleMicBtn" onclick="toggleMic()"><i class="fa-solid fa-microphone"></i> Micro</button>
      </div>

      <div class="btn-group">
        <button id="actionLiveBtn" class="btn-danger" onclick="toggleLiveStream()">
          <i class="fa-solid fa-satellite-dish"></i> PASSER EN DIRECT
        </button>
        <button id="downloadReplayBtn" class="btn-download" style="display:none;" onclick="downloadReplayVideo()">
          <i class="fa-solid fa-download"></i> Télécharger le Replay HD
        </button>
      </div>
    </div>

    <!-- Paramètres et Audience -->
    <div class="panel">
      <h3 class="panel-title"><i class="fa-solid fa-user-gear"></i> Paramètres du Studio & Audience</h3>
      
      <div id="authStatus" style="font-size: 0.8rem; color: #ffcc00; padding: 6px; background: #121212; border-radius: 4px;">
        Connexion à Firebase...
      </div>

      <div class="form-group">
        <label>Sélectionner la Caméra</label>
        <select id="cameraSelect" onchange="changeCameraDevice()"></select>
      </div>

      <div class="audience-box">
        <span style="font-size:0.85rem; color:#aaa;"><i class="fa-solid fa-users"></i> Spectateurs en direct sur la chaîne</span>
        <div class="audience-number" id="viewerCount">0</div>
      </div>
    </div>

  </div>

  <!-- Intégration Firebase officiel Mepla TV -->
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue, push, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDE4IZ6OdS4DnIJk61oopuILZc1Fx7wA6g",
      authDomain: "mepla-tv.firebaseapp.com",
      databaseURL: "https://mepla-tv-default-rtdb.firebaseio.com",
      projectId: "mepla-tv",
      storageBucket: "mepla-tv.firebasestorage.app",
      messagingSenderId: "1019186580961",
      appId: "1:1019186580961:web:84af8dc5d45d90376996a0",
      measurementId: "G-QPJ7ZF8F93"
    };

    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const authStatus = document.getElementById('authStatus');
    const viewerCountElement = document.getElementById('viewerCount');
    let currentUserId = null;
    let liveStatusRef = null;

    signInAnonymously(auth).catch((error) => {
      authStatus.innerText = "Erreur d'authentification Firebase.";
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUserId = user.uid;
        authStatus.innerText = "Studio connecté (ID sécurisé)";
        authStatus.style.color = "#2e7d32";

        loadChannelProfile(currentUserId);
        
        liveStatusRef = ref(db, `users/${currentUserId}/is_live`);

        const connectionsRef = ref(db, `users/${currentUserId}/active_viewers`);
        const myConnectionRef = push(connectionsRef);
        set(myConnectionRef, true);
        onDisconnect(myConnectionRef).remove();

        onValue(connectionsRef, (snapshot) => {
          const count = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
          viewerCountElement.innerText = count;
        });
      }
    });

    function loadChannelProfile(userId) {
      const profileRef = ref(db, `users/${userId}/channel_profile`);
      onValue(profileRef, (snapshot) => {
        if (snapshot.exists()) {
          const profile = snapshot.val();
          if (profile.channelName) {
            document.getElementById('headerChannelName').innerText = profile.channelName.toUpperCase() + " - RÉGIE DIRECT";
            document.getElementById('watermarkBrand').innerHTML = `${profile.channelName}<span>TV</span>`;
          }
        }
      });
    }

    window.updateLiveStatusInFirebase = function(status, streamUrl = "") {
      if (!currentUserId || !liveStatusRef) return;
      set(liveStatusRef, status);
      if (streamUrl) {
        set(ref(db, `users/${currentUserId}/live_url`), streamUrl);
      }
    };
  </script>

  <script>
    let localStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordedBlobUrl = null;
    let isLive = false;
    let isCamMuted = false;
    let isMicMuted = false;
    let useFrontCamera = false;
    let timerInterval = null;
    let secondsElapsed = 0;
    let selectedBg = 1; // 1: Blanc, 2: Bleu, 3: Jaune, 4: Néon

    const sourceVideo = document.getElementById('sourceVideo');
    const outputCanvas = document.getElementById('outputCanvas');
    const ctx = outputCanvas.getContext('2d');
    const cameraSelect = document.getElementById('cameraSelect');
    const liveBadge = document.getElementById('liveBadge');
    const actionLiveBtn = document.getElementById('actionLiveBtn');
    const timerDisplay = document.getElementById('timerDisplay');
    const timeCounter = document.getElementById('timeCounter');
    const downloadReplayBtn = document.getElementById('downloadReplayBtn');

    function setStudioBg(bgNum) {
      selectedBg = bgNum;
      document.querySelectorAll('.bg-btn').forEach((btn, idx) => {
        if (idx + 1 === bgNum) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    async function initDevices() {
      try {
        await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        
        cameraSelect.innerHTML = '';
        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Caméra ${index + 1}`;
          cameraSelect.appendChild(option);
        });

        await startCamera();
      } catch (err) {
        console.error("Erreur d'accès aux périphériques :", err);
        alert("Veuillez autoriser l'accès à la caméra et au micro.");
      }
    }

    async function startCamera() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }

      const deviceId = cameraSelect.value;
      const constraints = {
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          facingMode: useFrontCamera ? 'user' : 'environment',
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: true
      };

      try {
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        sourceVideo.srcObject = localStream;
        sourceVideo.muted = true;
        await sourceVideo.play();
        renderStudioFrame();
      } catch (err) {
        console.error("Erreur flux caméra :", err);
      }
    }

    // Moteur Studio HD : Nettoyage d'image & Application des fonds lumineux dynamiques
    function renderStudioFrame() {
      if (sourceVideo.paused || sourceVideo.ended) return;

      outputCanvas.width = sourceVideo.videoWidth || 1280;
      outputCanvas.height = sourceVideo.videoHeight || 720;
      const w = outputCanvas.width;
      const h = outputCanvas.height;

      // 1. Fond Lumineux Studio
      let grad = ctx.createLinearGradient(0, 0, w, h);
      if (selectedBg === 1) { // Blanc Lumineux
        grad.addColorStop(0, '#f8f9fa'); grad.addColorStop(1, '#e9ecef');
      } else if (selectedBg === 2) { // Bleu Électrique
        grad.addColorStop(0, '#005c8a'); grad.addColorStop(1, '#001e30');
      } else if (selectedBg === 3) { // Jaune Studio
        grad.addColorStop(0, '#ffcc00'); grad.addColorStop(1, '#ff8800');
      } else { // Cyber Néon
        grad.addColorStop(0, '#7928ca'); grad.addColorStop(1, '#ff0080');
      }

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // 2. Rendu de la caméra avec effet miroir si frontale et filtre netteté HD
      ctx.save();
      if (useFrontCamera) {
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
      }
      ctx.filter = 'contrast(1.15) brightness(1.05) saturate(1.1)'; // Nettoyage et amélioration de l'image en direct
      ctx.drawImage(sourceVideo, 0, 0, w, h);
      ctx.restore();

      requestAnimationFrame(renderStudioFrame);
    }

    async function changeCameraDevice() {
      await startCamera();
    }

    async function switchCamera() {
      useFrontCamera = !useFrontCamera;
      await startCamera();
    }

    function toggleCamera() {
      if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
          videoTrack.enabled = !videoTrack.enabled;
          isCamMuted = !videoTrack.enabled;
          const btn = document.getElementById('toggleCamBtn');
          btn.classList.toggle('active-state', isCamMuted);
          btn.innerHTML = isCamMuted ? `<i class="fa-solid fa-video-slash"></i> Caméra Off` : `<i class="fa-solid fa-video"></i> Caméra`;
        }
      }
    }

    function toggleMic() {
      if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
          audioTrack.enabled = !audioTrack.enabled;
          isMicMuted = !audioTrack.enabled;
          const btn = document.getElementById('toggleMicBtn');
          btn.classList.toggle('active-state', isMicMuted);
          btn.innerHTML = isMicMuted ? `<i class="fa-solid fa-microphone-slash"></i> Micro Off` : `<i class="fa-solid fa-microphone"></i> Micro`;
        }
      }
    }

    function toggleLiveStream() {
      isLive = !isLive;
      if (isLive) {
        liveBadge.classList.add('active');
        liveBadge.innerText = "EN DIRECT";
        actionLiveBtn.innerHTML = `<i class="fa-solid fa-stop"></i> ARRÊTER LE DIRECT`;
        actionLiveBtn.classList.remove('btn-danger');
        actionLiveBtn.classList.add('btn-success');
        
        downloadReplayBtn.style.display = "none";
        timerDisplay.style.display = "flex";
        startTimer();
        startRecording();

        if (window.updateLiveStatusInFirebase) {
          window.updateLiveStatusInFirebase(true);
        }
      } else {
        liveBadge.classList.remove('active');
        liveBadge.innerText = "HORS LIGNE";
        actionLiveBtn.classList.remove('btn-success');
        actionLiveBtn.classList.add('btn-danger');
        actionLiveBtn.innerHTML = `<i class="fa-solid fa-satellite-dish"></i> PASSER EN DIRECT`;
        
        stopTimer();
        stopRecording();

        if (window.updateLiveStatusInFirebase) {
          window.updateLiveStatusInFirebase(false);
        }
      }
    }

    function startTimer() {
      secondsElapsed = 0;
      timeCounter.innerText = "00:00";
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = Math.floor(secondsElapsed / 60);
        const secs = secondsElapsed % 60;
        timeCounter.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerDisplay.style.display = "none";
    }

    function startRecording() {
      recordedChunks = [];
      try {
        const canvasStream = outputCanvas.captureStream(30);
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) canvasStream.addTrack(audioTrack);

        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          recordedBlobUrl = URL.createObjectURL(blob);
          downloadReplayBtn.style.display = "flex";
        };
        mediaRecorder.start(1000);
      } catch (e) {
        console.log("Enregistrement canvas non supporté.");
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    // Téléchargement direct et enregistrement dans la mémoire du téléphone/ordinateur
    function downloadReplayVideo() {
      if (recordedBlobUrl) {
        const a = document.createElement('a');
        a.href = recordedBlobUrl;
        a.download = `MEPLA_TV_Direct_${Date.now()}.webm`;
        a.click();
      } else {
        alert("Aucun enregistrement disponible.");
      }
    }

    window.onload = initDevices;
  </script>
</body>
</html>
