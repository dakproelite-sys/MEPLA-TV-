  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }
    body {
      background: #070709;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-y: auto;
    }

    /* Entête Studio TV */
    header {
      background-color: #111116;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a35;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }
    .brand i { color: #ff0000; font-size: 1.4rem; }
    
    .badge-live {
      background: #383838;
      color: #aaa;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .badge-live.active {
      background: #ff0000;
      color: #fff;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    /* Layout Principal Centré et Standard TV 16:9 optimisé */
    .main-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    /* Moniteur Vidéo PRO & Canvas Studio au format TV exact */
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border: 3px solid #d4af37;
      box-shadow: 0 12px 35px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #sourceVideo { display: none; }
    #outputCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Logo de la chaîne en filigrane */
    .tv-logo-watermark {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 0.8rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
      backdrop-filter: blur(4px);
    }
    .tv-logo-watermark span { color: #ff0000; }

    /* Grand Chronomètre d'Antenne */
    .timer-overlay {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #ff0000;
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 1rem;
      color: #fff;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(4px);
    }
    .timer-overlay i { color: #ff0000; animation: blink 1s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

    /* Table de Journal Virtuelle incrustée */
    .virtual-desk-overlay {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 75%;
      height: 50px;
      background: linear-gradient(180deg, #1c1c24 0%, #0d0d12 100%);
      border-top: 3px solid #d4af37;
      border-radius: 12px 12px 0 0;
      box-shadow: 0 -8px 20px rgba(0,0,0,0.8);
      z-index: 4;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }
    .desk-screen-overlay {
      background: #000;
      border: 1px solid #d4af37;
      padding: 2px 12px;
      border-radius: 4px;
      color: #d4af37;
      font-weight: 900;
      font-size: 0.75rem;
      letter-spacing: 2px;
    }

    /* Barre de Contrôle Régie Pro */
    .controls-bar {
      background-color: #111116;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid #2a2a35;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background-color: #22222a;
      color: white;
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-size: 0.85rem;
      flex: 1;
      justify-content: center;
      min-width: 130px;
    }
    button:hover { background-color: #33333d; }
    button.btn-danger { background-color: #cc0000; flex: 2; font-size: 0.95rem; }
    button.btn-danger:hover { background-color: #ff0000; }
    button.btn-success { background-color: #2e7d32; flex: 2; font-size: 0.95rem; }
    button.btn-download { background-color: #3ea6ff; color: #000; flex: 2; }
    button.btn-copy { background-color: #d4af37; color: #000; flex: none; min-width: auto; padding: 0 14px; }
    
    button.btn-magic-bg {
      background: linear-gradient(135deg, #bf953f 0%, #d4af37 50%, #aa771c 100%);
      color: #000;
      flex: 2;
      font-size: 0.95rem;
      border: 1px solid #fff;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }
    button.btn-magic-bg.active-magic {
      background: linear-gradient(135deg, #2e7d32 0%, #4caf50 100%);
      color: #fff;
      box-shadow: 0 0 20px rgba(76, 175, 80, 0.8);
    }

    button.active-state { background-color: #ff4444 !important; color: #fff; }

    /* Panneau Paramètres & Fonds TV */
    .panel {
      background-color: #111116;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid #2a2a35;
    }
    .panel-title {
      font-size: 0.9rem;
      border-bottom: 1px solid #2a2a35;
      padding-bottom: 6px;
      color: #d4af37;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .category-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .tab-btn {
      background: #181820;
      border: 1px solid #2a2a35;
      color: #999;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      flex: none;
      min-width: auto;
    }
    .tab-btn:hover, .tab-btn.active {

      color: #000000;
      border-color: #d4af37;
    }

    .bg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;

    .bg-grid::-webkit-scrollbar { width: 4px; }
    .bg-grid::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 8px; }

    .bg-card {

      border: 2px solid transparent;

    label { font-size: 0.75rem; color: #aaa; }

      padding: 10px 14px;

      align-items: center;

<body>

  <!-- Intégration Firebase officiel -->
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue, push, onDisconnect, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDE4IZ6OdS4DnIJk61oopuILZc1Fx7wA6g",
      authDomain: "mepla-tv.firebaseapp.com",
      databaseURL: "https://mepla-tv-default-rtdb.firebaseio.com",
      projectId: "mepla-tv",
      storageBucket: "mepla-tv.firebasestorage.app",
      messagingSenderId: "1019186580961",
      appId: "1:1019186580961:web:84af8dc5d45d90376996a0",
      measurementId: "G-QPJ7ZF8F93"
    };

    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const authStatus = document.getElementById('authStatus');
    const viewerCountElement = document.getElementById('viewerCount');
    const channelNameInput = document.getElementById('channelNameInput');
    let currentUserId = null;
    let channelNameGlobal = "MEPLA TV";

    signInAnonymously(auth).catch((error) => {
      authStatus.innerText = "Erreur d'authentification Firebase.";
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUserId = user.uid;
        authStatus.innerText = "Connecté (Studio ID : " + currentUserId.substring(0, 6) + "...)";
        authStatus.style.color = "#4caf50";

        // Synchronisation automatique avec direct-television et studio-television
        const profileRef = ref(db, `direct-television/${currentUserId}/channel_profile`);
        onValue(profileRef, (snapshot) => {
          if (snapshot.exists()) {
            const profile = snapshot.val();
            if (profile.channelName) {
              channelNameGlobal = profile.channelName;
              channelNameInput.value = channelNameGlobal;
              applyChannelIdentity(channelNameGlobal);
            }
          } else {
            const defaultName = (user.displayName) ? user.displayName + " TV" : "Loïc TV";
            set(profileRef, {
              channelName: defaultName,
              createdAt: new Date().toISOString(),
              status: "Actif"
            });
            channelNameInput.value = defaultName;
            applyChannelIdentity(defaultName);
          }
        });

        // Gestion des spectateurs en direct
        const connectionsRef = ref(db, `direct-television/${currentUserId}/active_viewers`);
        const myConnectionRef = push(connectionsRef);
        set(myConnectionRef, true);
        onDisconnect(myConnectionRef).remove();

        onValue(connectionsRef, (snapshot) => {
          const count = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
          viewerCountElement.innerText = count;
        });
      }
    });

    function applyChannelIdentity(name) {
      const nameUp = name.toUpperCase();
      document.getElementById('headerChannelName').innerText = nameUp + " - RÉGIE DIRECT";
      document.getElementById('watermarkBrand').innerHTML = `${name}<span>TV</span>`;
      document.getElementById('deskBrandName').innerText = nameUp + " NEWS";
    }

    window.saveChannelNameInput = function() {
      const newName = channelNameInput.value.trim();
      if (!newName || !currentUserId) return;
      
      const profileData = {
        channelName: newName,
        updatedAt: new Date().toISOString()
      };

      // Écriture synchronisée dans direct-television et studio-television
      update(ref(db, `direct-television/${currentUserId}/channel_profile`), profileData);
      update(ref(db, `studio-television/${currentUserId}/channel_profile`), profileData).then(() => {
        channelNameGlobal = newName;
        applyChannelIdentity(newName);
        alert("Nom de la chaîne enregistré avec succès dans la base de données !");
      });
    };

    window.copyChannelName = function() {
      navigator.clipboard.writeText(channelNameInput.value);
      alert("Nom de la chaîne copié dans le presse-papier !");
    };

    window.updateLiveStatusInFirebase = function(isLiveActive) {
      if (!currentUserId) return;
      set(ref(db, `direct-television/${currentUserId}/is_live`), isLiveActive);
      set(ref(db, `studio-television/${currentUserId}/is_live`), isLiveActive);
    };
  </script>

      { id: 27, category: 'corporate', name: 'Salle de Conférence Moderne', type: 'linear', colors: ['#374151', '#1f2937', '#111827'], angle: 180 },
      { id: 28, category: 'corporate', name: 'Espace Innovation Tech', type: 'radial', colors: ['#0369a1', '#0c4a6e', '#020617'] },
      { id: 29, category: 'corporate', name: 'Architecture Bâtiment Verre', type: 'linear', colors: ['#475569', '#1e293b'], angle: 135 },
      { id: 30, category: 'corporate', name: 'Fond Financement & Bourse', type: 'radial', colors: ['#047857', '#064e3b', '#022c22'] },
      { id: 31, category: 'corporate', name: 'Espace Start-up & Digital', type: 'linear', colors: ['#3b82f6', '#1d4ed8', '#1e40af'], angle: 90 },
      { id: 32, category: 'corporate', name: 'Bureau Direction Sobre', type: 'radial', colors: ['#27272a', '#09090b'] },

      { id: 33, category: 'luxury', name: 'Or Métallique Prestige', type: 'linear', colors: ['#bf953f', '#fcf6ba', '#b38728', '#aa771c'], angle: 135 },
      { id: 34, category: 'luxury', name: 'Plateau Noir & Halo Doré', type: 'radial', colors: ['rgba(212, 175, 55, 0.45)', '#09090b'] },
      { id: 35, category: 'luxury', name: 'Marbre Noir & Veines Or', type: 'linear', colors: ['#090909', '#1a1a1a', '#d4af37'], angle: 45 },
      { id: 36, category: 'luxury', name: 'Édition Royale Champagne', type: 'linear', colors: ['#e6c875', '#8a6d2b'], angle: 180 },
      { id: 37, category: 'luxury', name: 'Velours Rouge & Or', type: 'radial', colors: ['#7f1d1d', '#450a0a', '#000000'] },
      { id: 38, category: 'luxury', name: 'Bleu Nuit VIP Gold', type: 'radial', colors: ['#1e3a8a', '#78350f', '#020617'] },
      { id: 39, category: 'luxury', name: 'Bronze Satiné de Luxe', type: 'radial', colors: ['#b45309', '#451a03'] },
      { id: 40, category: 'luxury', name: 'Sommet DAKPRO ÉLITE', type: 'linear', colors: ['#18181b', '#27272a', '#d4af37'], angle: 135 }
    ];

    let currentSelectedId = 1;
    let currentBgObj = studioBackgrounds[0];

    const sourceVideo = document.getElementById('sourceVideo');
    const outputCanvas = document.getElementById('outputCanvas');
    const ctx = outputCanvas.getContext('2d');
    const cameraSelect = document.getElementById('cameraSelect');
    const liveBadge = document.getElementById('liveBadge');
    const actionLiveBtn = document.getElementById('actionLiveBtn');
    const timerDisplay = document.getElementById('timerDisplay');
    const timeCounter = document.getElementById('timeCounter');
    const downloadReplayBtn = document.getElementById('downloadReplayBtn');
    const magicBgBtn = document.getElementById('magicBgBtn');

    async function initStudio() {
      renderGrid('all');
      await initSelfieSegmentation();
      initDevices();
    }

    async function initSelfieSegmentation() {
      try {
        selfieSegmentation = new SelfieSegmentation({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
        });
        selfieSegmentation.setOptions({ modelSelection: 1, selfieMode: false });
        selfieSegmentation.onResults(onSegmentationResults);
      } catch (e) {
        console.warn("MediaPipe non chargé, mode standard actif.");
      }
    }

    window.toggleMagicBackground = function() {
      isMagicBackgroundActive = !isMagicBackgroundActive;
      if (isMagicBackgroundActive) {
        magicBgBtn.classList.add('active-magic');
        magicBgBtn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> Effacement du Fond Actif (ON)`;
      } else {
        magicBgBtn.classList.remove('active-magic');
        magicBgBtn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> Activer Décoration & Effacement du Fond`;
      }
    }

    function renderGrid(filterCategory) {
      const bgGrid = document.getElementById('bgGrid');
      bgGrid.innerHTML = '';

      const filtered = filterCategory === 'all' 
        ? studioBackgrounds 
        : studioBackgrounds.filter(bg => bg.category === filterCategory);

      filtered.forEach(bg => {
        const card = document.createElement('div');
        card.className = `bg-card ${bg.id === currentSelectedId ? 'selected' : ''}`;
        card.style.background = getCssGradient(bg);
        card.setAttribute('onclick', `selectBackground(${bg.id})`);

        const label = document.createElement('div');
        label.className = 'bg-label';
        label.innerText = `${bg.id}. ${bg.name}`;

        card.appendChild(label);
        bgGrid.appendChild(card);
      });
    }

    function getCssGradient(bg) {
      if (bg.type === 'solid') return bg.color;
      if (bg.type === 'linear') return `linear-gradient(${bg.angle}deg, ${bg.colors.join(', ')})`;
      if (bg.type === 'radial') return `radial-gradient(circle at center, ${bg.colors.join(', ')})`;
      return '#000';
    }

    window.selectBackground = function(id) {
      currentSelectedId = id;
      currentBgObj = studioBackgrounds.find(b => b.id === id);
      if (!currentBgObj) return;

      document.getElementById('selectedCounter').innerText = `Option ${currentBgObj.id} / 40`;
      const activeCategory = document.querySelector('.tab-btn.active').getAttribute('onclick').match(/'([^']+)'/)[1];
      renderGrid(activeCategory);
    }

    window.filterCategory = function(cat) {
      document.querySelectorAll('.tab-btn').forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');
      renderGrid(cat);
    }

    async function initDevices() {
      try {
        await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        
        cameraSelect.innerHTML = '';
        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Caméra ${index + 1}`;
          cameraSelect.appendChild(option);
        });

        await startCamera();
      } catch (err) {
        console.error("Erreur d'accès aux périphériques :", err);
      }
    }

    async function startCamera() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }

      const deviceId = cameraSelect.value;
      const constraints = {
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          facingMode: useFrontCamera ? 'user' : 'environment',
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: true
      };

      try {
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        sourceVideo.srcObject = localStream;
        sourceVideo.muted = true;
        await sourceVideo.play();
        loopStudioFrame();
      } catch (err) {
        console.error("Erreur flux caméra :", err);
      }
    }

    function loopStudioFrame() {
      if (sourceVideo.paused || sourceVideo.ended) return;

      if (isMagicBackgroundActive && selfieSegmentation) {
        selfieSegmentation.send({ image: sourceVideo }).then(() => {
          requestAnimationFrame(loopStudioFrame);
        }).catch(() => {
          renderStandardFrame();
          requestAnimationFrame(loopStudioFrame);
        });
      } else {
        renderStandardFrame();
        requestAnimationFrame(loopStudioFrame);
      }
    }

    function renderStandardFrame() {
      outputCanvas.width = sourceVideo.videoWidth || 1280;
      outputCanvas.height = sourceVideo.videoHeight || 720;
      const w = outputCanvas.width;
      const h = outputCanvas.height;

      // 1. Dessiner le fond dynamique sélectionné (Garanti de s'afficher instantanément)
      drawStudioBackground(w, h);

      // 2. Dessiner la vidéo de la caméra par-dessus
      ctx.save();
      if (useFrontCamera) {
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
      }
      ctx.filter = 'contrast(1.1) brightness(1.05) saturate(1.1)';
      ctx.drawImage(sourceVideo, 0, 0, w, h);
      ctx.restore();
    }

    function onSegmentationResults(results) {
      outputCanvas.width = sourceVideo.videoWidth || 1280;
      outputCanvas.height = sourceVideo.videoHeight || 720;
      const w = outputCanvas.width;
      const h = outputCanvas.height;

      segmentationMaskCanvas.width = w;
      segmentationMaskCanvas.height = h;

      drawStudioBackground(w, h);

      ctx.save();
      if (useFrontCamera) {
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
      }
      
      segmentationCtx.clearRect(0, 0, w, h);
      segmentationCtx.drawImage(results.segmentationMask, 0, 0, w, h);
      
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.filter = 'contrast(1.1) brightness(1.05) saturate(1.1)';
      ctx.drawImage(sourceVideo, 0, 0, w, h);

      ctx.globalCompositeOperation = 'destination-in';
      ctx.drawImage(segmentationMaskCanvas, 0, 0, w, h);
      ctx.restore();
      
      ctx.restore();
    }

    function drawStudioBackground(w, h) {
      if (!currentBgObj) return;
      if (currentBgObj.type === 'solid') {
        ctx.fillStyle = currentBgObj.color;
        ctx.fillRect(0, 0, w, h);
      } else if (currentBgObj.type === 'linear') {
        const rad = (currentBgObj.angle * Math.PI) / 180;
        const x1 = w/2 - Math.cos(rad) * w;
        const y1 = h/2 - Math.sin(rad) * h;
        const x2 = w/2 + Math.cos(rad) * w;
        const y2 = h/2 + Math.sin(rad) * h;
        let grad = ctx.createLinearGradient(x1, y1, x2, y2);
        currentBgObj.colors.forEach((c, idx) => {
          grad.addColorStop(idx / (currentBgObj.colors.length - 1), c);
        });
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      } else if (currentBgObj.type === 'radial') {
        let grad = ctx.createRadialGradient(w/2, h/2, 10, w/2, h/2, Math.max(w, h)/1.2);
        currentBgObj.colors.forEach((c, idx) => {
          grad.addColorStop(idx / (currentBgObj.colors.length - 1), c);
        });
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }
    }

    window.changeCameraDevice = async function() {
      await startCamera();
    }

    window.switchCamera = async function() {
      useFrontCamera = !useFrontCamera;
      await startCamera();
    }

    window.toggleCamera = function() {
      if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
          videoTrack.enabled = !videoTrack.enabled;
          isCamMuted = !videoTrack.enabled;
          const btn = document.getElementById('toggleCamBtn');
          btn.classList.toggle('active-state', isCamMuted);
          btn.innerHTML = isCamMuted ? `<i class="fa-solid fa-video-slash"></i> Caméra Off` : `<i class="fa-solid fa-video"></i> Caméra`;
        }
      }
    }

    window.toggleMic = function() {
      if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
          audioTrack.enabled = !audioTrack.enabled;
          isMicMuted = !audioTrack.enabled;
          const btn = document.getElementById('toggleMicBtn');
          btn.classList.toggle('active-state', isMicMuted);
          btn.innerHTML = isMicMuted ? `<i class="fa-solid fa-microphone-slash"></i> Micro Off` : `<i class="fa-solid fa-microphone"></i> Micro`;
        }
      }
    }

    window.toggleLiveStream = function() {
      isLive = !isLive;
      if (isLive) {
        liveBadge.classList.add('active');
        liveBadge.innerText = "EN DIRECT";
        actionLiveBtn.innerHTML = `<i class="fa-solid fa-stop"></i> ARRÊTER LE DIRECT`;
        actionLiveBtn.classList.remove('btn-danger');
        actionLiveBtn.classList.add('btn-success');
        
        downloadReplayBtn.style.display = "none";
        timerDisplay.style.display = "flex";
        startTimer();
        startRecording();

        if (window.updateLiveStatusInFirebase) {
          window.updateLiveStatusInFirebase(true);
        }
      } else {
        liveBadge.classList.remove('active');
        liveBadge.innerText = "HORS LIGNE";
        actionLiveBtn.classList.remove('btn-success');
        actionLiveBtn.classList.add('btn-danger');
        actionLiveBtn.innerHTML = `<i class="fa-solid fa-satellite-dish"></i> DÉMARRER LE DIRECT`;
        
        stopTimer();
        stopRecording();

        if (window.updateLiveStatusInFirebase) {
          window.updateLiveStatusInFirebase(false);
        }
      }
    }

    function startTimer() {
      secondsElapsed = 0;
      timeCounter.innerText = "00:00";
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = Math.floor(secondsElapsed / 60);
        const secs = secondsElapsed % 60;
        timeCounter.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerDisplay.style.display = "none";
    }

    function startRecording() {
      recordedChunks = [];
      try {
        const canvasStream = outputCanvas.captureStream(30);
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) canvasStream.addTrack(audioTrack);

        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          recordedBlobUrl = URL.createObjectURL(blob);
          downloadReplayBtn.style.display = "flex";
        };
        mediaRecorder.start(1000);
      } catch (e) {
        console.log("Enregistrement canvas non supporté.");
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    window.downloadReplayVideo = function() {
      if (recordedBlobUrl) {
        const a = document.createElement('a');
        a.href = recordedBlobUrl;
        a.download = `MEPLA_TV_Direct_${Date.now()}.webm`;
        a.click();
      } else {
        alert("Aucun enregistrement disponible.");
      }
    }

    window.onload = initStudio;
  </script>
