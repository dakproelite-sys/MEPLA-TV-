<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f19">

    <title>MEPLA TV - Connexion / Inscription</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: #161e2e;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .auth-header h1 {
            font-size: 20px;
            color: #38bdf8;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .auth-header p {
            font-size: 12px;
            color: #9ca3af;
        }

        /* ONGlets */
        .tabs {
            display: flex;
            background: #0b0f19;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 20px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #9ca3af;
            padding: 10px 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }

        .tab-btn.active {
            background: #2563eb;
            color: #ffffff;
        }

        .tab-btn:focus-visible {
            outline: 2px solid #38bdf8;
            outline-offset: 2px;
        }

        /* FORMULAIRES */
        .form-section {
            display: none !important;
        }

        .form-section.active {
            display: block !important;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #d1d5db;
            margin-bottom: 5px;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input {
            width: 100%;
            padding: 11px 10px;
            background: #0b0f19;
            border: 1px solid #374151;
            color: #ffffff;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #38bdf8;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #9ca3af;
        }

        .toggle-password:hover {
            color: #38bdf8;
        }

        .auth-btn {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .auth-btn:hover {
            background: #1d4ed8;
        }

        .auth-btn:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #9ca3af;
            text-decoration: none;
        }

        .back-link:hover {
            color: #38bdf8;
        }

        .message {
            margin-top: 12px;
            font-size: 12px;
            text-align: center;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        @media (max-width: 360px) {
            .auth-container {
                padding: 18px;
            }

            .auth-header h1 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="auth-container">

    <div class="auth-header">
        <h1>MEPLA TV</h1>
        <p>Espace de Connexion &amp; Inscription des Créateurs</p>
    </div>

    <!-- ONGLET CONNEXION / INSCRIPTION -->

    <div class="tabs" role="tablist" aria-label="Connexion ou inscription">

        <button
            type="button"
            class="tab-btn active"
            id="btn-login"
            role="tab"
            aria-selected="true"
            aria-controls="section-login">
            Connexion
        </button>

        <button
            type="button"
            class="tab-btn"
            id="btn-register"
            role="tab"
            aria-selected="false"
            aria-controls="section-register">
            Inscription
        </button>

    </div>

    <!-- FORMULAIRE DE CONNEXION -->

    <section
        id="section-login"
        class="form-section active"
        role="tabpanel"
        aria-labelledby="btn-login">

        <form id="login-form">

            <div class="form-group">
                <label for="login-nom">Nom de la chaîne</label>

                <input
                    type="text"
                    id="login-nom"
                    placeholder="Entrez le nom de votre chaîne"
                    autocomplete="username"
                    required>
            </div>

            <div class="form-group">
                <label for="login-pass">Mot de passe</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="login-pass"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        data-password-target="login-pass"
                        aria-label="Afficher ou masquer le mot de passe">
                        👁️
                    </button>
                </div>
            </div>

            <button
                type="submit"
                class="auth-btn"
                id="login-submit">
                Se connecter
            </button>

            <div
                id="login-msg"
                class="message"
                role="status"
                aria-live="polite">
            </div>

        </form>

    </section>

    <!-- FORMULAIRE D'INSCRIPTION -->

    <section
        id="section-register"
        class="form-section"
        role="tabpanel"
        aria-labelledby="btn-register"
        hidden>

        <form id="register-form">

            <div class="form-group">
                <label for="reg-nom">
                    Nom de la Télévision / Chaîne
                </label>

                <input
                    type="text"
                    id="reg-nom"
                    placeholder="Ex : MEPLA TV Officiel"
                    maxlength="100"
                    autocomplete="organization"
                    required>
            </div>

            <div class="form-group">
                <label for="reg-email">Adresse e-mail</label>

                <input
                    type="email"
                    id="reg-email"
                    placeholder="votre@email.com"
                    autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <label for="reg-desc">
                    Description / Type de contenu
                </label>

                <input
                    type="text"
                    id="reg-desc"
                    placeholder="Musique chrétienne, Journal & Émissions"
                    maxlength="300">
            </div>

            <div class="form-group">
                <label for="reg-pass">Créer un mot de passe</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="reg-pass"
                        placeholder="6 caractères minimum"
                        autocomplete="new-password"
                        minlength="6"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        data-password-target="reg-pass"
                        aria-label="Afficher ou masquer le mot de passe">
                        👁️
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="reg-pass-confirm">
                    Confirmer le mot de passe
                </label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="reg-pass-confirm"
                        placeholder="Confirmez votre mot de passe"
                        autocomplete="new-password"
                        minlength="6"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        data-password-target="reg-pass-confirm"
                        aria-label="Afficher ou masquer la confirmation du mot de passe">
                        👁️
                    </button>
                </div>
            </div>

            <button
                type="submit"
                class="auth-btn"
                id="register-submit">
                S'inscrire et créer mon profil TV
            </button>

            <div
                id="reg-msg"
                class="message"
                role="status"
                aria-live="polite">
            </div>

        </form>

    </section>

    <a href="index.html" class="back-link">
        ← Retourner à la page d'accueil de MEPLA TV
    </a>

</div>

<!-- FIREBASE : CONFIGURATION PARTAGÉE -->

<script type="module">

    import {
        auth,
        db,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        signOut,
        ref,
        set,
        get,
        child,
        updateProfile
    } from "./firebase-config.js";

    const PROFILE_PATH = "television_profils";

    const DEFAULT_PHOTO =
        "https://i.postimg.cc/Zqm3K70t/grok-1792570897280.jpg";

    // --------------------------------------------------
    // ÉLÉMENTS HTML
    // --------------------------------------------------

    const loginSection = document.getElementById("section-login");
    const registerSection = document.getElementById("section-register");

    const loginTab = document.getElementById("btn-login");
    const registerTab = document.getElementById("btn-register");

    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");

    const loginButton = document.getElementById("login-submit");
    const registerButton = document.getElementById("register-submit");

    const loginMessage = document.getElementById("login-msg");
    const registerMessage = document.getElementById("reg-msg");

    // --------------------------------------------------
    // BASCULEMENT CONNEXION / INSCRIPTION
    // --------------------------------------------------

    function switchTab(tab) {
        const showLogin = tab === "login";

        // Mettre à jour les classes des onglets.
        loginTab.classList.toggle("active", showLogin);
        registerTab.classList.toggle("active", !showLogin);

        // Mettre à jour l'accessibilité.
        loginTab.setAttribute("aria-selected", String(showLogin));
        registerTab.setAttribute("aria-selected", String(!showLogin));

        // Afficher et masquer les formulaires.
        loginSection.classList.toggle("active", showLogin);
        registerSection.classList.toggle("active", !showLogin);

        // Synchroniser l'attribut hidden avec le CSS.
        loginSection.hidden = !showLogin;
        registerSection.hidden = showLogin;

        // Effacer les anciens messages.
        loginMessage.textContent = "";
        registerMessage.textContent = "";
    }

    // Les événements sont enregistrés directement sur les boutons.
    loginTab.addEventListener("click", function() {
        switchTab("login");
    });

    registerTab.addEventListener("click", function() {
        switchTab("register");
    });

    // Conserver aussi la compatibilité avec switchTab('login')
    // et switchTab('register') si d'autres éléments l'utilisent.
    window.switchTab = switchTab;

    // Afficher Connexion au chargement de la page.
    switchTab("login");

    // --------------------------------------------------
    // AFFICHER / MASQUER LES MOTS DE PASSE
    // --------------------------------------------------

    document.querySelectorAll("[data-password-target]").forEach(function(button) {

        button.addEventListener("click", function() {
            const fieldId = button.dataset.passwordTarget;
            const input = document.getElementById(fieldId);

            if (!input) {
                return;
            }

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "🙈";
            } else {
                input.type = "password";
                button.textContent = "👁️";
            }
        });

    });

    // --------------------------------------------------
    // AFFICHAGE DES MESSAGES
    // --------------------------------------------------

    function showMessage(element, message, type = "info") {
        const colors = {
            info: "#38bdf8",
            success: "#10b981",
            error: "#ef4444"
        };

        element.style.color = colors[type] || colors.info;
        element.textContent = message;
    }

    // --------------------------------------------------
    // ÉTAT DE CHARGEMENT DES BOUTONS
    // --------------------------------------------------

    function setLoading(button, loading, normalText, waitingText) {
        button.disabled = loading;
        button.textContent = loading ? waitingText : normalText;
    }

    // --------------------------------------------------
    // NORMALISER LE NOM DE LA CHAÎNE
    // --------------------------------------------------

    function normalizeChannelName(name) {
        return name
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .trim()
            .replace(/[^a-z0-9]+/g, "_")
            .replace(/^_+|_+$/g, "");
    }

    // --------------------------------------------------
    // TRADUIRE LES ERREURS FIREBASE
    // --------------------------------------------------

    function firebaseErrorMessage(error) {
        switch (error.code) {

            case "auth/email-already-in-use":
                return "Cette adresse e-mail est déjà utilisée.";

            case "auth/invalid-email":
                return "L'adresse e-mail n'est pas valide.";

            case "auth/weak-password":
                return "Le mot de passe doit contenir au moins 6 caractères.";

            case "auth/invalid-credential":
            case "auth/wrong-password":
            case "auth/user-not-found":
            case "auth/invalid-login-credentials":
                return "Nom de chaîne ou mot de passe incorrect.";

            case "auth/too-many-requests":
                return "Trop de tentatives. Réessayez plus tard.";

            case "auth/network-request-failed":
                return "Vérifiez votre connexion Internet.";

            case "auth/operation-not-allowed":
                return "Activez la connexion par e-mail et mot de passe dans Firebase Authentication.";

            case "auth/email-already-exists":
                return "Cette adresse e-mail est déjà utilisée.";

            case "auth/permission-denied":
                return "Accès refusé par Firebase. Vérifiez les règles de la base de données.";

            default:
                console.error("Erreur MEPLA TV :", error);
                return "Une erreur est survenue. Vérifiez votre connexion et réessayez.";
        }
    }

    // --------------------------------------------------
    // ENREGISTRER LA SESSION
    // --------------------------------------------------

    function saveTVSession(user, data, cleanKey) {
        localStorage.setItem("active_tv_user", user.uid);
        localStorage.setItem("active_tv_nom", data.nom);
        localStorage.setItem("active_tv_key", cleanKey);
    }

    // --------------------------------------------------
    // INSCRIPTION
    // --------------------------------------------------

    registerForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const nom = document.getElementById("reg-nom").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const description = document.getElementById("reg-desc").value.trim();
        const password = document.getElementById("reg-pass").value;
        const confirmation = document.getElementById("reg-pass-confirm").value;

        registerMessage.textContent = "";

        if (!nom || !email || !password || !confirmation) {
            showMessage(
                registerMessage,
                "Veuillez remplir tous les champs obligatoires.",
                "error"
            );
            return;
        }

        if (password.length < 6) {
            showMessage(
                registerMessage,
                "Le mot de passe doit contenir au moins 6 caractères.",
                "error"
            );
            return;
        }

        if (password !== confirmation) {
            showMessage(
                registerMessage,
                "Les deux mots de passe ne correspondent pas.",
                "error"
            );
            return;
        }

        const cleanKey = normalizeChannelName(nom);

        if (!cleanKey) {
            showMessage(
                registerMessage,
                "Veuillez choisir un nom de chaîne valide.",
                "error"
            );
            return;
        }

        setLoading(
            registerButton,
            true,
            "S'inscrire et créer mon profil TV",
            "Création du compte..."
        );

        let accountCreated = false;

        try {

            // Vérifier si le nom de chaîne existe déjà.
            const profileRef = ref(
                db,
                PROFILE_PATH + "/" + cleanKey
            );

            const existingProfile = await get(profileRef);

            if (existingProfile.exists()) {
                showMessage(
                    registerMessage,
                    "Ce nom de chaîne est déjà utilisé. Choisissez un autre nom.",
                    "error"
                );
                return;
            }

            // Créer le compte Firebase Authentication.
            const credential = await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

            const user = credential.user;
            accountCreated = true;

            // Ajouter le nom de chaîne au compte Firebase.
            await updateProfile(user, {
                displayName: nom
            });

            // Construire le profil TV.
            const profileData = {
                uid: user.uid,
                nom: nom,
                description: description || "Chaîne MEPLA TV",
                photo: DEFAULT_PHOTO,
                email: email,
                createdAt: new Date().toISOString()
            };

            // Enregistrer le profil dans Realtime Database.
            await set(profileRef, profileData);

            // Sauvegarder la session.
            saveTVSession(user, profileData, cleanKey);

            showMessage(
                registerMessage,
                "Inscription réussie ! Ouverture de votre profil télévision...",
                "success"
            );

            // Redirection après réussite.
            setTimeout(function() {
                window.location.href = "profil-television.html";
            }, 1000);

        } catch (error) {

            console.error("Erreur d'inscription MEPLA TV :", error);

            if (accountCreated) {
                showMessage(
                    registerMessage,
                    "Le compte a été créé, mais l'enregistrement du profil a échoué. Vérifiez les règles Firebase avant de réessayer.",
                    "error"
                );
            } else {
                showMessage(
                    registerMessage,
                    firebaseErrorMessage(error),
                    "error"
                );
            }

        } finally {

            setLoading(
                registerButton,
                false,
                "S'inscrire et créer mon profil TV",
                "Création du compte..."
            );

        }

    });

    // --------------------------------------------------
    // CONNEXION AVEC NOM DE CHAÎNE ET MOT DE PASSE
    // --------------------------------------------------

    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const nomInput = document.getElementById("login-nom").value.trim();
        const password = document.getElementById("login-pass").value;

        loginMessage.textContent = "";

        if (!nomInput || !password) {
            showMessage(
                loginMessage,
                "Veuillez saisir le nom de votre chaîne et votre mot de passe.",
                "error"
            );
            return;
        }

        const cleanKey = normalizeChannelName(nomInput);

        setLoading(
            loginButton,
            true,
            "Se connecter",
            "Connexion en cours..."
        );

        try {

            // Retrouver le profil dans Realtime Database.
            const snapshot = await get(
                child(
                    ref(db),
                    PROFILE_PATH + "/" + cleanKey
                )
            );

            if (!snapshot.exists()) {
                showMessage(
                    loginMessage,
                    "Nom de chaîne introuvable. Vérifiez votre saisie ou inscrivez-vous.",
                    "error"
                );
                return;
            }

            const data = snapshot.val();

            if (!data.email || !data.uid || !data.nom) {
                showMessage(
                    loginMessage,
                    "Le profil de cette chaîne est incomplet.",
                    "error"
                );
                return;
            }

            // Connexion Firebase Authentication.
            const credential = await signInWithEmailAndPassword(
                auth,
                data.email,
                password
            );

            const user = credential.user;

            // Vérifier que le compte correspond au profil TV.
            if (user.uid !== data.uid) {

                await signOut(auth);

                localStorage.removeItem("active_tv_user");
                localStorage.removeItem("active_tv_nom");
                localStorage.removeItem("active_tv_key");

                showMessage(
                    loginMessage,
                    "Le compte authentifié ne correspond pas à ce profil.",
                    "error"
                );

                return;
            }

            // Enregistrer la session.
            saveTVSession(user, data, cleanKey);

            showMessage(
                loginMessage,
                "Connexion réussie ! Ouverture de votre profil télévision...",
                "success"
            );

            // Redirection après connexion.
            setTimeout(function() {
                window.location.href = "profil-television.html";
            }, 800);

        } catch (error) {

            showMessage(
                loginMessage,
                firebaseErrorMessage(error),
                "error"
            );

        } finally {

            setLoading(
                loginButton,
                false,
                "Se connecter",
                "Connexion en cours..."
            );

        }

    });

</script>

</body>
</html>
