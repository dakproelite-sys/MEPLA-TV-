<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEPLA TV - Connexion / Inscription</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #0b0f19; 
            color: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: #161e2e;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .auth-header h1 { font-size: 20px; color: #38bdf8; margin-bottom: 5px; font-weight: bold; }
        .auth-header p { font-size: 12px; color: #9ca3af; }

        /* Onglets bascule */
        .tabs {
            display: flex;
            background: #0b0f19;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #9ca3af;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #2563eb;
            color: #fff;
        }

        /* Formulaires */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #d1d5db;
            margin-bottom: 5px;
        }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            padding-right: 40px;
            background: #0b0f19;
            border: 1px solid #374151;
            color: #fff;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #38bdf8;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #9ca3af;
        }
        .toggle-password:hover {
            color: #38bdf8;
        }

        .auth-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .auth-btn:hover { background: #1d4ed8; }

        .form-section { display: none; }
        .form-section.active { display: block; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #9ca3af;
            text-decoration: none;
        }
        .back-link:hover { color: #38bdf8; }

        .message {
            margin-top: 12px;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h1>MEPLA TV</h1>
            <p>Espace de Connexion & Inscription des Créateurs</p>
        </div>

        <!-- Boutons pour basculer entre Connexion et Inscription -->
        <div class="tabs">
            <button class="tab-btn active" id="btn-login" onclick="switchTab('login')">Connexion</button>
            <button class="tab-btn" id="btn-register" onclick="switchTab('register')">Inscription</button>
        </div>

        <!-- FORMULAIRE DE CONNEXION -->
        <div id="section-login" class="form-section active">
            <div class="form-group">
                <label>Nom de la Chaîne</label>
                <input type="text" id="login-nom" placeholder="Entrez le nom de votre chaîne">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <div class="password-wrapper">
                    <input type="password" id="login-pass" placeholder="Votre mot de passe">
                    <button type="button" class="toggle-password" onclick="togglePassword('login-pass', this)">👁️</button>
                </div>
            </div>
            <button class="auth-btn" onclick="handleLogin()">Se Connecter</button>
            <div id="login-msg" class="message"></div>
        </div>

        <!-- FORMULAIRE D'INSCRIPTION -->
        <div id="section-register" class="form-section">
            <div class="form-group">
                <label>Nom de la Télévision / Chaîne</label>
                <input type="text" id="reg-nom" placeholder="Ex: MEPLA TV Officiel">
            </div>
            <div class="form-group">
                <label>Adresse Email</label>
                <input type="email" id="reg-email" placeholder="votre@email.com">
            </div>
            <div class="form-group">
                <label>Description / Type de contenu</label>
                <input type="text" id="reg-desc" placeholder="Ex: Musique chrétienne, Journal & Émissions">
            </div>
            <div class="form-group">
                <label>Créer un Mot de passe</label>
                <div class="password-wrapper">
                    <input type="password" id="reg-pass" placeholder="6 caractères minimum">
                    <button type="button" class="toggle-password" onclick="togglePassword('reg-pass', this)">👁️</button>
                </div>
            </div>
            <div class="form-group">
                <label>Confirmer le Mot de passe</label>
                <div class="password-wrapper">
                    <input type="password" id="reg-pass-confirm" placeholder="Confirmez votre mot de passe">
                    <button type="button" class="toggle-password" onclick="togglePassword('reg-pass-confirm', this)">👁️</button>
                </div>
            </div>
            <button class="auth-btn" onclick="handleRegister()">S'inscrire et Publier</button>
            <div id="reg-msg" class="message"></div>
        </div>

        <a href="index.html" class="back-link">← Retourner à la page d'accueil de MEPLA TV</a>
    </div>

    <!-- MODULES FIREBASE (AUTH & REALTIME DATABASE) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getDatabase, 
            ref, 
            set, 
            get, 
            child 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // VOS IDENTIFIANTS FIREBASE OFFICIELS
        const firebaseConfig = {
            apiKey: "AIzaSyDE4IZ6OdS4DnIJk61oopuILZc1Fx7wA6g",
            authDomain: "mepla-tv.firebaseapp.com",
            databaseURL: "https://mepla-tv-default-rtdb.firebaseio.com",
            projectId: "mepla-tv",
            storageBucket: "mepla-tv.firebasestorage.app",
            messagingSenderId: "1019186580961",
            appId: "1:1019186580961:web:84af8dc5d45d90376996a0",
            measurementId: "G-QPJ7ZF8F93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Fonction pour afficher/masquer le mot de passe via l'icône œil
        window.togglePassword = function(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "🙈";
            } else {
                input.type = "password";
                btn.textContent = "👁️";
            }
        };

        // Bascule entre les onglets (INTacte et non modifiée)
        window.switchTab = function(tab) {
            document.getElementById('section-login').classList.remove('active');
            document.getElementById('section-register').classList.remove('active');
            document.getElementById('btn-login').classList.remove('active');
            document.getElementById('btn-register').classList.remove('active');

            if(tab === 'login') {
                document.getElementById('section-login').classList.add('active');
                document.getElementById('btn-login').classList.add('active');
            } else {
                document.getElementById('section-register').classList.add('active');
                document.getElementById('btn-register').classList.add('active');
            }
        };

        // INSCRIPTION DANS FIREBASE AUTH + REALTIME DATABASE
        window.handleRegister = async function() {
            const nom = document.getElementById('reg-nom').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const description = document.getElementById('reg-desc').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const passConfirm = document.getElementById('reg-pass-confirm').value.trim();
            const msgBox = document.getElementById('reg-msg');

            if(!nom || !email || !pass || !passConfirm) {
                msgBox.style.color = "#ef4444";
                msgBox.innerText = "Veuillez remplir tous les champs obligatoires (Nom, Email, Mots de passe).";
                return;
            }

            if(pass !== passConfirm) {
                msgBox.style.color = "#ef4444";
                msgBox.innerText = "Les mots de passe ne correspondent pas.";
                return;
            }

            if(pass.length < 6) {
                msgBox.style.color = "#ef4444";
                msgBox.innerText = "Le mot de passe doit contenir au moins 6 caractères.";
                return;
            }

            // Clé unique pour la Realtime Database
            const cleanKey = nom.toLowerCase().replace(/[^a-z0-9]/g, '_');

            try {
                msgBox.style.color = "#38bdf8";
                msgBox.innerText = "Création du compte en cours...";

                // 1. Création dans Firebase Authentication User avec le vrai email saisi
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // 2. Enregistrement des détails dans Realtime Database sous 'television_profils'
                await set(ref(db, 'television_profils/' + cleanKey), {
                    uid: user.uid,
                    nom: nom,
                    description: description || 'Chaîne MEPLA TV',
                    photo: 'https://via.placeholder.com/70',
                    email: email,
                    createdAt: new Date().toISOString()
                });

                msgBox.style.color = "#10b981";
                msgBox.innerText = "Inscription réussie ! Profil MEPLA TV créé. Redirection...";
                
                localStorage.setItem("active_tv_user", user.uid);
                localStorage.setItem("active_tv_nom", nom);

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);

            } catch (error) {
                console.error("Erreur Inscription Firebase:", error);
                msgBox.style.color = "#ef4444";
                if(error.code === 'auth/email-already-in-use') {
                    msgBox.innerText = "Cet email est déjà utilisé.";
                } else if(error.code === 'auth/invalid-email') {
                    msgBox.innerText = "Format d'email invalide.";
                } else {
                    msgBox.innerText = "Erreur : " + error.message;
                }
            }
        };

        // CONNEXION FIREBASE AUTH + REALTIME DATABASE
        window.handleLogin = async function() {
            const nomInput = document.getElementById('login-nom').value.trim();
            const passInput = document.getElementById('login-pass').value.trim();
            const msgBox = document.getElementById('login-msg');

            if(!nomInput || !passInput) {
                msgBox.style.color = "#ef4444";
                msgBox.innerText = "Veuillez remplir tous les champs.";
                return;
            }

            const cleanKey = nomInput.toLowerCase().replace(/[^a-z0-9]/g, '_');

            try {
                msgBox.style.color = "#38bdf8";
                msgBox.innerText = "Connexion en cours...";

                // 1. Récupérer d'abord l'email associé à ce nom de chaîne dans la Realtime Database
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, `television_profils/${cleanKey}`));

                if (!snapshot.exists()) {
                    msgBox.style.color = "#ef4444";
                    msgBox.innerText = "Nom de chaîne introuvable dans la base de données.";
                    return;
                }

                const data = snapshot.val();
                const userEmail = data.email;

                // 2. Connexion via Firebase Authentication User avec l'email récupéré
                const userCredential = await signInWithEmailAndPassword(auth, userEmail, passInput);
                const user = userCredential.user;

                msgBox.style.color = "#10b981";
                msgBox.innerText = "Connexion réussie ! Bienvenue sur MEPLA TV, " + data.nom;
                
                localStorage.setItem("active_tv_user", user.uid);
                localStorage.setItem("active_tv_nom", data.nom);

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);

            } catch (error) {
                console.error("Erreur Connexion Firebase:", error);
                msgBox.style.color = "#ef4444";
                msgBox.innerText = "Nom de chaîne ou mot de passe incorrect.";
            }
        };
    </script>
</body>
</html>
