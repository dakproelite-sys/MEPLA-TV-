<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAKPRO TV - Master 24/7 & Bassin de Diffusion</title>
  <!-- FontAwesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }
    body {
      background: #0b0b0f;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: #1a1a24;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #383838;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: 1px;
    }
    .brand i { color: #ff0000; font-size: 1.5rem; }
    .status-badge {
      background: #2e7d32;
      color: #fff;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .main-container {
      display: grid;
      grid-template-columns: 320px 1fr 360px;
      gap: 16px;
      padding: 16px;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    .column {
      background-color: #1a1a24;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid #383838;
      height: 100%;
      overflow-y: auto;
    }

    .center-column {
      background: transparent;
      border: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .panel-title {
      font-size: 0.95rem;
      border-bottom: 1px solid #383838;
      padding-bottom: 8px;
      color: #3ea6ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border: 2px solid #333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tv-logo-watermark {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
      pointer-events: none;
      backdrop-filter: blur(4px);
      max-width: 140px;
    }
    .tv-logo-watermark img {
      width: 30px;
      height: 30px;
      object-fit: cover;
      border-radius: 50%;
    }
    .tv-logo-watermark span {
      font-weight: 900;
      font-size: 0.85rem;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .on-air-overlay {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(200, 0, 0, 0.9);
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      z-index: 5;
      display: none;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; color: #aaa; }
    input, select { background-color: #121212; border: 1px solid #383838; color: white; padding: 8px 10px; border-radius: 6px; outline: none; font-size: 0.85rem; }
    input:focus, select:focus { border-color: #3ea6ff; }
    
    button {
      background-color: #3ea6ff;
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }
    button:hover { background-color: #61b8ff; }

    .playlist-container {
      flex: 1;
      background: #121212;
      border-radius: 8px;
      border: 1px solid #383838;
      overflow-y: auto;
      max-height: 250px;
      padding: 8px;
    }
    .playlist-item {
      padding: 8px;
      border-bottom: 1px solid #222;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .playlist-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }

    @media (max-width: 1000px) {
      .main-container { grid-template-columns: 1fr; overflow-y: auto; height: auto; }
      body { overflow: auto; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <i class="fa-solid fa-tv"></i>
      <span id="headerChannelName">DAKPRO TV - MASTER 24/7</span>
    </div>
    <div id="masterStatus" class="status-badge">SYSTÈME EN LIGNE</div>
  </header>

  <div class="main-container">
    
    <!-- Colonne 1 : Profil de la Chaîne -->
    <div class="column">
      <h3 class="panel-title"><i class="fa-solid fa-user-gear"></i> Profil de la Chaîne</h3>
      
      <div id="authStatus" style="font-size: 0.8rem; color: #ffcc00; padding: 6px; background: #121212; border-radius: 4px;">
        Connexion à Firebase...
      </div>

      <div class="form-group">
        <label>Nom de la Chaîne</label>
        <input type="text" id="profileChannelName" placeholder="Ex: DAKPRO TV">
      </div>

      <div class="form-group">
        <label>URL du Logo de la Chaîne (Image)</label>
        <input type="text" id="profileLogoUrl" placeholder="https://exemple.com/logo.png">
      </div>

      <div class="form-group">
        <label>Position du Logo</label>
        <select id="profileLogoPosition">
          <option value="left">Coin Supérieur Gauche</option>
          <option value="right">Coin Supérieur Droit</option>
        </select>
      </div>

      <button onclick="saveChannelProfile()"><i class="fa-solid fa-floppy-disk"></i> Enregistrer le Profil</button>
    </div>

    <!-- Colonne 2 : Lecteur Master (Centre) -->
    <div class="center-column">
      <div class="video-wrapper">
        <div class="tv-logo-watermark" id="watermarkBrand" style="left: 16px; right: auto;">
          <img id="watermarkImg" src="" style="display:none;" alt="Logo">
          <span id="watermarkText">DAKPRO TV</span>
        </div>
        
        <div class="on-air-overlay" id="onAirBadge"><i class="fa-solid fa-satellite-dish"></i> EN DIRECT</div>

        <video id="masterVideo" controls autoplay playsinline></video>
      </div>

      <div style="background: #1a1a24; padding: 14px; border-radius: 8px; border: 1px solid #383838;">
        <h4 style="font-size: 0.9rem; color: #3ea6ff; margin-bottom: 4px;"><i class="fa-solid fa-circle-play"></i> En diffusion en ce moment :</h4>
        <p id="currentPlayingTitle" style="font-size: 0.85rem; color: #ccc;">Chargement de la grille 24/7...</p>
      </div>
    </div>

    <!-- Colonne 3 : Grille de Programmes (Droite) -->
    <div class="column">
      <h3 class="panel-title"><i class="fa-solid fa-list-check"></i> Ajouter un Clip / Film</h3>
      
      <div class="form-group">
        <label>Titre du Média</label>
        <input type="text" id="mediaTitle" placeholder="Ex: Clip Vidéo - Artiste X">
      </div>

      <div class="form-group">
        <label>URL Directe (.mp4)</label>
        <input type="text" id="mediaUrl" placeholder="https://exemple.com/video.mp4">
      </div>

      <button onclick="addNewMediaToFirebase()"><i class="fa-solid fa-plus"></i> Ajouter à la Grille</button>

      <h3 class="panel-title" style="margin-top: 10px;"><i class="fa-solid fa-calendar-days"></i> Grille Programmée</h3>
      <div class="playlist-container" id="playlistItems"></div>
    </div>

  </div>

  <!-- Intégration Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "VOTRE_API_KEY",
      authDomain: "votre-projet.firebaseapp.com",
      databaseURL: "https://votre-projet-default-rtdb.firebaseio.com",
      projectId: "votre-projet",
      storageBucket: "votre-projet.appspot.com",
      messagingSenderId: "XXXXXX",
      appId: "XXXXXX"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const masterVideo = document.getElementById('masterVideo');
    const currentPlayingTitle = document.getElementById('currentPlayingTitle');
    const playlistContainer = document.getElementById('playlistItems');
    const onAirBadge = document.getElementById('onAirBadge');
    const authStatus = document.getElementById('authStatus');

    let currentUserId = null;
    let playlist = [];
    let currentIndex = 0;
    let isLiveActive = false;

    signInAnonymously(auth).catch((error) => {
      authStatus.innerText = "Erreur d'authentification.";
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUserId = user.uid;
        authStatus.innerText = "Connecté (ID sécurisé)";
        authStatus.style.color = "#2e7d32";

        loadUserProfile(currentUserId);
        loadPlaylist(currentUserId);
        listenLiveStatus(currentUserId);
      }
    });

    function loadUserProfile(userId) {
      const profileRef = ref(db, `users/${userId}/channel_profile`);
      onValue(profileRef, (snapshot) => {
        if (snapshot.exists()) {
          const profile = snapshot.val();
          document.getElementById('profileChannelName').value = profile.channelName || "";
          document.getElementById('profileLogoUrl').value = profile.logoUrl || "";
          document.getElementById('profileLogoPosition').value = profile.position || "left";

          updateWatermarkUI(profile.channelName, profile.logoUrl, profile.position);
        }
      });
    }

    window.saveChannelProfile = function() {
      if (!currentUserId) return alert("Non authentifié !");
      const channelName = document.getElementById('profileChannelName').value.trim();
      const logoUrl = document.getElementById('profileLogoUrl').value.trim();
      const position = document.getElementById('profileLogoPosition').value;

      set(ref(db, `users/${currentUserId}/channel_profile`), { channelName, logoUrl, position })
        .then(() => alert("Profil enregistré avec succès !"))
        .catch((e) => alert("Erreur : " + e.message));
    };

    function updateWatermarkUI(name, logoUrl, position) {
      const watermarkBrand = document.getElementById('watermarkBrand');
      const watermarkImg = document.getElementById('watermarkImg');
      const watermarkText = document.getElementById('watermarkText');
      const headerChannelName = document.getElementById('headerChannelName');

      if (name) {
        watermarkText.innerText = name;
        headerChannelName.innerText = name.toUpperCase() + " - MASTER 24/7";
      }

      if (logoUrl) {
        watermarkImg.src = logoUrl;
        watermarkImg.style.display = 'block';
      } else {
        watermarkImg.style.display = 'none';
      }

      if (position === 'right') {
        watermarkBrand.style.left = 'auto';
        watermarkBrand.style.right = '16px';
      } else {
        watermarkBrand.style.right = 'auto';
        watermarkBrand.style.left = '16px';
      }
    }

    // Gestion rigoureuse de l'état du Direct vs Grille 24/7
    function listenLiveStatus(userId) {
      const liveStatusRef = ref(db, `users/${userId}/is_live`);
      const liveUrlRef = ref(db, `users/${userId}/live_url`);

      onValue(liveStatusRef, (snapshot) => {
        isLiveActive = snapshot.val();
        if (isLiveActive) {
          onAirBadge.style.display = 'block';
          currentPlayingTitle.innerText = "🔴 DIFFUSION EN DIRECT";
          
          // Récupérer l'URL du flux direct si disponible
          onValue(liveUrlRef, (urlSnap) => {
            if (urlSnap.exists() && urlSnap.val()) {
              masterVideo.src = urlSnap.val();
              masterVideo.play().catch(e => console.log("Attente de lecture direct..."));
            }
          }, { onlyOnce: true });
        } else {
          onAirBadge.style.display = 'none';
          // Reprise immédiate de la grille 24/7 sans espace vide
          if (playlist.length > 0) {
            playCurrentMedia();
          }
        }
      });
    }

    function loadPlaylist(userId) {
      const playlistRef = ref(db, `users/${userId}/playlist`);
      onValue(playlistRef, (snapshot) => {
        playlist = [];
        playlistContainer.innerHTML = '';
        
        if (snapshot.exists()) {
          const data = snapshot.val();
          Object.keys(data).forEach(key => { playlist.push(data[key]); });
          renderPlaylistUI();

          if (!isLiveActive && masterVideo.paused && playlist.length > 0) {
            currentIndex = 0;
            playCurrentMedia();
          }
        } else {
          currentPlayingTitle.innerText = "Aucun média programmé.";
        }
      });
    }

    function playCurrentMedia() {
      if (isLiveActive || playlist.length === 0) return;
      
      const currentMedia = playlist[currentIndex];
      masterVideo.src = currentMedia.url;
      currentPlayingTitle.innerText = currentMedia.title;
      masterVideo.play().catch(e => console.log("Lecture automatique en attente..."));

      masterVideo.onended = () => {
        if (!isLiveActive) {
          currentIndex = (currentIndex + 1) % playlist.length;
          playCurrentMedia();
        }
      };
    }

    function renderPlaylistUI() {
      playlistContainer.innerHTML = '';
      playlist.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'playlist-item';
        div.innerHTML = `<span>${index + 1}. ${item.title}</span> <i class="fa-solid fa-film" style="color:#3ea6ff;"></i>`;
        playlistContainer.appendChild(div);
      });
    }

    window.addNewMediaToFirebase = function() {
      if (!currentUserId) return alert("Non authentifié !");
      const title = document.getElementById('mediaTitle').value.trim();
      const url = document.getElementById('mediaUrl').value.trim();

      if (title && url) {
        set(push(ref(db, `users/${currentUserId}/playlist`)), { title, url });
        document.getElementById('mediaTitle').value = '';
        document.getElementById('mediaUrl').value = '';
      } else {
        alert("Remplissez le titre et l'URL.");
      }
    };
  </script>
</body>
</html>
